[package]
name = "gamesync-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gamesync-core = { path = "../gamesync-core" }
gamesync-protocol = { path = "../gamesync-protocol" }
tokio = { version = "1", features = ["rt", "fs"] }
