name: GameSync builds
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'LICENSE'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: gamesync-linux-x64
            extensions: deb,AppImage
            bundles: deb,appimage
          - os: windows-2022
            artifact: gamesync-windows-x64
            extensions: exe
            bundles: nsis
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable tag such as v1.2.3' >&2; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xvfb gnome-keyring dbus-x11
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: cargo +stable test --workspace --exclude gamesync-server --locked
      - name: Verify recovery after running out of disk space
        if: runner.os == 'Linux'
        run: |
          volume=$(mktemp -d)
          sudo mount -t tmpfs -o "size=1m,uid=$(id -u),gid=$(id -g),mode=0700" tmpfs "$volume"
          trap 'sudo umount "$volume" && rmdir "$volume"' EXIT
          GAMESYNC_TEST_LIMITED_VOLUME="$volume" cargo +stable test --locked -p gamesync-sync --test restore -- --ignored --exact linux_restore_retries_after_volume_runs_out_of_space
      - working-directory: apps/desktop
        run: npm ci
      - working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            npm run tauri -- build --ci --bundles ${{ matrix.bundles }} --config "{\"version\":\"${RELEASE_TAG#v}\"}" -- --locked
          else
            npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
          fi
      - run: cargo +stable test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol
      - name: Verify the native Linux interface
        if: runner.os == 'Linux'
        run: |
          cargo +stable build --locked -p gamesync-server
          cargo +stable build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol,desktop-smoke
          xvfb-run -a python3 apps/desktop/tests/smoke.py
      - name: Install and launch the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one NSIS installer.' }
          & apps/desktop/tests/package-smoke.ps1 -Installer $installer.FullName
      - name: Install and launch Linux packages
        if: runner.os == 'Linux'
        run: |
          bundle=apps/desktop/src-tauri/target/release/bundle
          sudo apt-get install -y "$PWD"/"$bundle"/deb/*.deb
          xvfb-run -a dbus-run-session -- python3 apps/desktop/tests/package-smoke.py "$(command -v gamesync-desktop)"
          xvfb-run -a dbus-run-session -- python3 apps/desktop/tests/package-smoke.py "$bundle"/appimage/*.AppImage
      - name: Collect installers and checksums
        shell: bash
        env:
          EXTENSIONS: ${{ matrix.extensions }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil
          bundles = pathlib.Path("apps/desktop/src-tauri/target/release/bundle")
          destination = pathlib.Path("release-artifacts")
          destination.mkdir()
          checksums = []
          for suffix in os.environ["EXTENSIONS"].split(","):
              candidates = list(bundles.rglob(f"*.{suffix}"))
              if len(candidates) != 1:
                  raise SystemExit(f"Expected exactly one .{suffix} package, found {candidates}")
              package = shutil.copy2(candidates[0], destination)
              digest = hashlib.sha256()
              with open(package, "rb") as content:
                  for block in iter(lambda: content.read(1024 * 1024), b""):
                      digest.update(block)
              checksums.append(f"{digest.hexdigest()}  {candidates[0].name}\n")
          shutil.copy2("LICENSE", destination)
          (destination / f"SHA256SUMS-{os.environ['ARTIFACT']}").write_text("".join(checksums), encoding="ascii")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/
          if-no-files-found: error

  release:
    needs: desktop
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gamesync-windows-x64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: gamesync-linux-x64
          path: linux
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            tag="$REF_NAME"
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
            prerelease=()
            title="GameSync $tag"
            base=$(git tag --merged "$COMMIT" --sort=-version:refname |
              awk -v tag="$tag" '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ {
                if (found) { print; exit }
                if ($0 == tag) found = 1
              }')
          else
            tag="beta-$COMMIT"
            prerelease=(--prerelease)
            title="GameSync bêta ${COMMIT:0:7}"
            base="$BEFORE"
            if ! git merge-base --is-ancestor "$base" "$COMMIT" 2>/dev/null; then
              base=$(git rev-parse --verify --quiet "$COMMIT^" || true)
            fi
          fi
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" != true ]]; then
              echo "Release $tag already published; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$tag" --target "$COMMIT" --draft "${prerelease[@]}" --title "$title" --notes ""
          fi
          range="$COMMIT"
          if [[ -n "$base" ]]; then
            range="$base..$COMMIT"
          fi
          {
            printf '## Changements\n\n'
            changes=$(git log --format='- %s (`%h`)' "$range")
            printf '%s\n' "${changes:-Aucun nouveau commit dans cette version.}"
            if [[ -n "$base" ]]; then
              printf '\n[Voir le diff complet](%s/%s/compare/%s...%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$base" "$COMMIT"
            fi
            printf '\n[Guide d’installation](%s/%s/blob/%s/docs/install.md)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$COMMIT"
          } > release-notes.md
          gh release upload "$tag" windows/* linux/*.deb linux/*.AppImage linux/SHA256SUMS-* --clobber
          gh release edit "$tag" --notes-file release-notes.md --draft=false
