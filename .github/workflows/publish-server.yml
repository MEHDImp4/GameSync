name: Publish server image

on:
  push:
    branches: [main]
    paths: &server_paths
      - 'server/**'
      - 'docker/**'
      - 'crates/gamesync-core/**'
      - 'crates/gamesync-storage/**'
      - 'crates/gamesync-protocol/**'
      - 'crates/gamesync-sync/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.dockerignore'
      - '.github/workflows/publish-server.yml'
  pull_request:
    paths: *server_paths
  workflow_dispatch:

concurrency:
  group: publish-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable test --locked -p gamesync-server
      - uses: docker/setup-buildx-action@v3
      - name: Build x86-64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          tags: gamesync-server:local
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          load: true
          cache-from: type=gha,scope=gamesync-server
          cache-to: type=gha,scope=gamesync-server,mode=max
      - name: Test Docker deployment and persistence
        run: bash server/tests/compose-smoke.sh --no-build
      - name: Export tested image
        if: github.ref == 'refs/heads/main'
        run: |
          docker save gamesync-server:local | gzip -1 > gamesync-server-linux-amd64.tar.gz
          sha256sum gamesync-server-linux-amd64.tar.gz > gamesync-server-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: gamesync-server-linux-amd64
          path: |
            gamesync-server-linux-amd64.tar.gz
            gamesync-server-linux-amd64.tar.gz.sha256
          if-no-files-found: error
      - name: Sign in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish tested image
        if: github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/gamesync-server"
          docker tag gamesync-server:local "$image:sha-${GITHUB_SHA}"
          docker tag gamesync-server:local "$image:latest"
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
