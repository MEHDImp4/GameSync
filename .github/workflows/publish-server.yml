name: Publish server image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Test Docker deployment and persistence
        run: bash server/tests/compose-smoke.sh
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Build and publish x86-64 image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/gamesync-server"
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$image:latest" -t "$image:sha-${GITHUB_SHA}" -f server/Dockerfile .
          docker push "$image:sha-${GITHUB_SHA}"
          docker push "$image:latest"
