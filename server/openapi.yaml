openapi: 3.1.0
info:
  title: GameSync API
  version: 0.1.0
  description: Self-hosted synchronization of game save files. Use HTTPS for remotely reachable instances. Busy routes can return 503 and should be retried with backoff.
security:
  - deviceToken: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "204": { description: Server ready }
  /openapi.yaml:
    get:
      security: []
      responses:
        "200":
          description: This specification
          content:
            application/yaml:
              schema: { type: string }
  /v1/retention:
    put:
      summary: Change snapshot retention for the server
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [keep_count, keep_days]
              properties:
                keep_count: { type: integer, minimum: 1, maximum: 4294967295 }
                keep_days: { type: integer, minimum: 1, maximum: 4294967295 }
      responses:
        '204': { description: Retention policy saved }
        '400': { description: Retention values must be positive }
        '401': { description: Missing or invalid device credentials }
        '403': { description: Administrator privileges required }
        '422': { description: Invalid request fields }
  /v1/status:
    get:
      responses:
        "200":
          description: Current storage usage and recent server activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/pair:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name]
              properties:
                code: { $ref: "#/components/schemas/Secret" }
                name: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: New device credentials. Keep the token in the system credential store.
          content:
            application/json:
              schema:
                type: object
                required: [device, token]
                properties:
                  device: { $ref: "#/components/schemas/Uuid" }
                  token: { $ref: "#/components/schemas/Secret" }
        "400": { description: Invalid code or device name format }
        "401": { description: Unknown, expired or consumed code }
        "429": { description: Too many pairing attempts. Retry after 60 seconds. }
  /v1/devices:
    get:
      responses:
        "200":
          description: Devices in the current GameSync instance
          content:
            application/json:
              schema:
                type: object
                required: [current, administrator, items]
                properties:
                  current: { $ref: "#/components/schemas/Uuid" }
                  administrator: { type: boolean }
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/devices/invitations:
    post:
      responses:
        "200":
          description: One-time invitation for a regular device, valid for 600 seconds
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: { $ref: "#/components/schemas/Secret" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Administrator role required }
  /v1/devices/{target}:
    parameters:
      - { name: target, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    delete:
      responses:
        "204": { description: Device revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Administrator role required. Self-revocation over HTTP is forbidden. }
        "404": { description: Unknown device }
  /v1/games:
    get:
      responses:
        "200":
          description: Game catalog. Root IDs and labels are portable across clients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Game" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/games/{game}:
    parameters:
      - $ref: "#/components/parameters/Game"
    put:
      description: Register a new game or verify that an existing game uses the same logical roots.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Game" }
      responses:
        "204": { description: Registered or already using these roots }
        "400": { description: Invalid registration }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Game already uses different roots }
  /v1/games/{game}/head:
    parameters:
      - $ref: "#/components/parameters/Game"
    get:
      responses:
        "200":
          description: Current revision ID, or null if no head exists
          content:
            application/json:
              schema: { type: [integer, "null"], format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      description: Publish verified objects relative to a base revision. Retrying the same request UUID and payload is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request, manifest]
              properties:
                request: { $ref: "#/components/schemas/Uuid" }
                base: { type: [integer, "null"], format: int64 }
                resolves: { type: [integer, "null"], format: int64, description: Open variant to close atomically with publication }
                manifest: { $ref: "#/components/schemas/Manifest" }
      responses:
        "200": { $ref: "#/components/responses/Publication" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Base revision or an object is missing }
        "409":
          description: A conflicting variant was stored, or the request UUID or registered roots did not match. Only stored variants return the JSON publication.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "412": { description: The conflict was already closed or the expected head changed }
        "413": { description: Manifest or file size limit exceeded }
        "422": { description: Manifest is invalid or stored content failed verification }
  /v1/games/{game}/revisions:
    parameters:
      - $ref: "#/components/parameters/Game"
    get:
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Up to 50 revisions, newest first. Expired snapshots are omitted.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/games/{game}/revisions/{id}:
    parameters:
      - $ref: "#/components/parameters/Game"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      responses:
        "200":
          description: Snapshot manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Revision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown revision }
        "410": { description: Revision contents expired }
  /v1/uploads:
    delete:
      responses:
        "204": { description: Authenticated device's incomplete transfer was cancelled }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/uploads/{digest}/{size}:
    parameters:
      - $ref: "#/components/parameters/Digest"
      - $ref: "#/components/parameters/Size"
    get:
      responses:
        "200": { $ref: "#/components/responses/UploadProgress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: This device has a different incomplete upload }
        "413": { description: File exceeds the maximum of 1 GiB }
  /v1/uploads/{digest}/{size}/{offset}:
    parameters:
      - $ref: "#/components/parameters/Digest"
      - $ref: "#/components/parameters/Size"
      - { name: offset, in: path, required: true, schema: { type: integer, minimum: 0 } }
    put:
      description: Append a block of up to 8 MiB at the confirmed byte offset. The final block is validated against BLAKE3 before publication.
      requestBody:
        $ref: "#/components/requestBodies/Block"
      responses:
        "200": { $ref: "#/components/responses/UploadProgress" }
        "400": { description: Invalid digest, offset or body length }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Offset differs from stored state or another upload is incomplete }
        "413": { description: File or block size limit exceeded }
        "422": { description: Final payload failed integrity validation }
  /v1/objects/{digest}:
    parameters:
      - $ref: "#/components/parameters/Digest"
    put:
      description: Upload files up to 8 MiB in a single request.
      requestBody:
        $ref: "#/components/requestBodies/Block"
      responses:
        "204": { description: Object stored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: Payload too large }
        "422": { description: Digest mismatch }
  /v1/objects/{digest}/{size}:
    parameters:
      - $ref: "#/components/parameters/Digest"
      - $ref: "#/components/parameters/Size"
    get:
      parameters:
        - name: Range
          in: header
          description: Only a single open-ended range of the form bytes=N- is supported.
          schema: { type: string, pattern: '^bytes=[0-9]+-$' }
      responses:
        "200": { $ref: "#/components/responses/ObjectBytes" }
        "206": { $ref: "#/components/responses/ObjectBytes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Unknown object }
        "416": { description: Range is unsupported or outside the file }
        "422": { description: Size or digest mismatch }
components:
  securitySchemes:
    deviceToken: { type: http, scheme: bearer }
  parameters:
    Game: { name: game, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
    Digest: { name: digest, in: path, required: true, schema: { $ref: "#/components/schemas/Secret" } }
    Size: { name: size, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 1073741824 } }
  requestBodies:
    Block:
      required: true
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
  responses:
    Unauthorized: { description: Missing, invalid or revoked device token }
    ObjectBytes:
      description: Verified object payload
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    UploadProgress:
      description: Current offset and completion state
      content:
        application/json:
          schema:
            type: object
            required: [offset, complete]
            properties:
              offset: { type: integer, minimum: 0 }
              complete: { type: boolean }
    Publication:
      description: Stored revision ID and conflict indicator
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Publication" }
  schemas:
    Uuid: { type: string, format: uuid }
    Secret: { type: string, pattern: '^[a-f0-9]{64}$' }
    Device:
      type: object
      required: [id, name, administrator, revoked, last_seen]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        name: { type: string }
        administrator: { type: boolean }
        revoked: { type: boolean }
        last_seen: { type: [integer, "null"], description: Unix timestamp }
    Game:
      type: object
      additionalProperties: false
      required: [id, title, roots]
      properties:
        id: { $ref: "#/components/schemas/Uuid" }
        title: { type: string, minLength: 1, maxLength: 128 }
        roots:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: { $ref: "#/components/schemas/Uuid" }
              label: { type: string, minLength: 1, maxLength: 128 }
    Manifest:
      type: array
      maxItems: 4096
      items:
        type: object
        additionalProperties: false
        required: [root, path, size, digest]
        properties:
          root: { $ref: "#/components/schemas/Uuid" }
          path: { type: string, description: Portable path relative to the logical root }
          size: { type: integer, minimum: 0, maximum: 1073741824 }
          digest: { $ref: "#/components/schemas/Secret" }
    Publication:
      type: object
      required: [revision, conflict]
      properties:
        revision: { type: integer, format: int64 }
        conflict: { type: boolean }
    HistoryEntry:
      type: object
      required: [id, machine, created_at, published, resolved_by, bytes]
      properties:
        id: { type: integer, format: int64 }
        machine: { $ref: "#/components/schemas/Uuid" }
        created_at: { type: integer, description: Unix timestamp }
        published: { type: boolean }
        resolved_by: { type: [integer, "null"], format: int64 }
        bytes: { type: integer, minimum: 0 }
    Revision:
      type: object
      required: [id, machine, created_at, published, resolved_by, manifest]
      properties:
        id: { type: integer, format: int64 }
        machine: { $ref: "#/components/schemas/Uuid" }
        created_at: { type: integer, description: Unix timestamp }
        published: { type: boolean }
        resolved_by: { type: [integer, "null"], format: int64 }
        manifest: { $ref: "#/components/schemas/Manifest" }
    Status:
      type: object
      required: [used_bytes, objects, synchronized_games, keep_count, keep_days, latest, errors]
      properties:
        used_bytes: { type: integer, minimum: 0, description: Stored object payload bytes }
        objects: { type: integer, minimum: 0 }
        synchronized_games: { type: integer, minimum: 0 }
        keep_count: { type: integer, minimum: 1 }
        keep_days: { type: integer, minimum: 1 }
        latest:
          type: array
          items:
            type: object
            required: [revision, game, title, machine, created_at]
            properties:
              revision: { type: integer, format: int64 }
              game: { $ref: "#/components/schemas/Uuid" }
              title: { type: [string, "null"] }
              machine: { $ref: "#/components/schemas/Uuid" }
              created_at: { type: integer, description: Unix timestamp }
        errors:
          type: array
          items:
            type: object
            required: [time, operation, status]
            properties:
              time: { type: integer, description: Unix timestamp }
              operation: { type: string }
              status: { type: [integer, "null"], description: HTTP status if applicable }
